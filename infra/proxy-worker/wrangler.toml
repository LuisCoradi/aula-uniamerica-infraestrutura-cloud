name = "trabaidafacul-proxy"
main = "src/index.js"
compatibility_date = "2026-09-07"

# Este e o unico Worker exposto. Mesmo assim, sem URL *.workers.dev:
# so responde nos hostnames oficiais do dominio.
workers_dev = false

# Custom Domains: a Cloudflare cria o registro DNS e emite o certificado
# TLS automaticamente para cada hostname abaixo.
routes = [
  { pattern = "app.trabaidafacul.site", custom_domain = true },
  { pattern = "api.trabaidafacul.site", custom_domain = true },
]

# As duas origens do Front-end (redundancia).
# Para simular a queda da origem 1 no teste 7, troque ORIGIN_1 por um host
# inexistente (ex.: "origem-fora-do-ar.pages.dev") e rode wrangler deploy.
[vars]
ORIGIN_1 = "trabaidafacul.pages.dev"
ORIGIN_2 = "trabaidafacul-b.pages.dev"

# Service Binding: ligacao interna com o Back-end.
# Nao usa rede publica, nao tem URL, nao passa pela Internet.
[[services]]
binding = "API"
service = "trabaidafacul-api"

[observability]
enabled = true
